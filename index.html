<!-- index.html -->

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Семейный сайт</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ФОН -->
  <div class="background"></div>

  <!-- ШАПКА -->
  <header class="header">

    <h1>НАША СЕМЬЯ ❤️</h1>

    <p>
      Дела семьи, задания и планы
    </p>

  </header>

  <!-- СЕМЬЯ -->

  <section class="family">

    <!-- НАДЯ -->
    <div class="family-card">

      <h2>Сестра Надя</h2>

      <textarea id="nadyaInput"
      placeholder="Например: сделать уроки"></textarea>

      <button onclick="saveTask('nadya')">
        Сохранить
      </button>

      <div id="nadyaTasks" class="tasks"></div>

    </div>

    <!-- МАМА -->
    <div class="family-card">

      <h2>Мама Юля</h2>

      <textarea id="momInput"
      placeholder="Добавить задание"></textarea>

      <button onclick="saveTask('mom')">
        Сохранить
      </button>

      <div id="momTasks" class="tasks"></div>

    </div>

    <!-- ПАПА -->
    <div class="family-card">

      <h2>Папа Сережа</h2>

      <textarea id="dadInput"
      placeholder="Добавить задание"></textarea>

      <button onclick="saveTask('dad')">
        Сохранить
      </button>

      <div id="dadTasks" class="tasks"></div>

    </div>

    <!-- ЖЕНЯ -->
    <div class="family-card">

      <h2>Сын Женя</h2>

      <textarea id="zhenyaInput"
      placeholder="Добавить задание"></textarea>

      <button onclick="saveTask('zhenya')">
        Сохранить
      </button>

      <div id="zhenyaTasks" class="tasks"></div>

    </div>

  </section>

  <!-- ДОСКА ПОЧЕТА -->

  <section class="honor-board">

    <h2 class="board-title">
      ДОСКА ПОЧЕТА 🏆
    </h2>

    <div class="board-card">

      <textarea id="honorInput"
      placeholder="Добавляйте заслуги за неделю"></textarea>

      <button onclick="saveTask('honor')">
        Добавить
      </button>

      <div id="honorTasks" class="tasks"></div>

    </div>

  </section>

  <!-- ПЛАНЫ -->

  <section class="plans">

    <h2 class="plans-title">
      Ближайшие планы на лето ☀️
    </h2>

    <div class="plan-card">
      <p>• Женя и Надя едут в лагерь</p>
    </div>

    <div class="plan-card">
      <p>• Вся семья едет на море</p>
    </div>

    <div class="plan-card">
      <p>• Семейный отдых и прогулки</p>
    </div>

  </section>

  <!-- TELEGRAM -->

  <footer class="footer">

    <div class="telegram-box">

      <a href="https://t.me/askrubot?start=5836107276"
      target="_blank">

        <img src="tg.png" class="tg-icon" alt="">

      </a>

      <p class="tg-text">
        Если хочешь что-то добавить —
        пиши сюда
      </p>

    </div>

  </footer>

  <script type="module" src="script.js"></script>

</body>
</html>
